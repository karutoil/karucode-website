name: deploy

on:
  push:
    branches: [main]
  schedule:
    # Daily sync at 04:00 UTC: if karucode published docs, build and deploy them.
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'karucode ref to sync from (branch, tag or commit)'
        required: false
        default: 'main'

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: checkout website
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: install dependencies
        run: npm ci

      - name: full check (sync docs, astro check, build, link audit, csp hashes)
        run: npm run check
        env:
          KARUCODE_DOCS_REF: ${{ github.event.inputs.ref || 'main' }}

      - name: deploy to cloudflare pages
        if: github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler pages deploy dist --project-name karucode-website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
